name: Validate

on:
  push:
    branches: [main, master]
  pull_request:

env:
  GODOT_VERSION: 4.7.1

jobs:
  signaling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/signaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/signaling/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm audit --audit-level=high

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Godot and web templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: Import and parse project
        run: ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --editor --quit
      - name: Run unit tests
        run: |
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --script res://tests/run_tests.gd
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . res://tests/offline_modes_smoke.tscn
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . res://tests/online_match_smoke.tscn
      - name: Export browser build
        run: |
          mkdir -p build/web
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --export-release "Web" build/web/index.html
